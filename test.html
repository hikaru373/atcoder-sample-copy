<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AtCoder Sample Copy Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }

        #task-statement {
            max-width: 800px;
        }

        .part {
            margin-bottom: 30px;
        }

        section {
            border-bottom: 1px solid #ddd;
            padding-bottom: 20px;
        }

        h2 {
            margin-top: 40px;
        }

        h3 {
            margin-bottom: 10px;
        }

        pre {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            overflow-x: auto;
        }

        .btn-copy {
            display: inline-block;
            margin-left: 10px;
            padding: 2px 8px;
            font-size: 12px;
            color: #fff;
            background: #007bff;
            border-radius: 3px;
        }
    </style>
</head>

<body>

    <div id="task-statement">

        <!-- 問題文 -->
        <div class="part">
            <section>
                <h2>問題文</h2>

                <p>
                    整数 N と整数列 A が与えられます。
                    条件を満たす答えを求めてください。
                </p>
            </section>
        </div>


        <!-- 制約 -->
        <div class="part">
            <section>
                <h3>制約</h3>

                <ul>
                    <li>1 ≤ N ≤ 10<sup>5</sup></li>
                    <li>1 ≤ A<sub>i</sub> ≤ 10<sup>9</sup></li>
                </ul>
            </section>
        </div>


        <!-- 入力例1 -->
        <div class="part">
            <section>
                <h3>
                    入力例 1
                    <span class="btn-copy">Copy</span>
                </h3>

                <div class="div-btn-copy">
                    <button type="button">Copy</button>
                </div>

                <pre id="pre-sample0">8 5
3 3 5 5 4 4 3 2</pre>
            </section>
        </div>


        <!-- 出力例1 -->
        <div class="part">
            <section>
                <h3>
                    出力例 1
                    <span class="btn-copy">Copy</span>
                </h3>

                <div class="div-btn-copy">
                    <button type="button">Copy</button>
                </div>

                <pre id="pre-sample1">3</pre>
            </section>
        </div>


        <!-- 入力例2 -->
        <div class="part">
            <section>
                <h3>
                    入力例 2
                    <span class="btn-copy">Copy</span>
                </h3>

                <div class="div-btn-copy">
                    <button type="button">Copy</button>
                </div>

                <pre id="pre-sample2">5
1 2 3 4 5</pre>
            </section>
        </div>


        <!-- 出力例2 -->
        <div class="part">
            <section>
                <h3>
                    出力例 2
                    <span class="btn-copy">Copy</span>
                </h3>

                <div class="div-btn-copy">
                    <button type="button">Copy</button>
                </div>

                <pre id="pre-sample3">15</pre>
            </section>
        </div>


        <!-- 入力例3 -->
        <div class="part">
            <section>
                <h3>
                    入力例 3
                    <span class="btn-copy">Copy</span>
                </h3>

                <div class="div-btn-copy">
                    <button type="button">Copy</button>
                </div>

                <pre id="pre-sample4">3
10 20 30</pre>
            </section>
        </div>


        <!-- 出力例3 -->
        <div class="part">
            <section>
                <h3>
                    出力例 3
                    <span class="btn-copy">Copy</span>
                </h3>

                <div class="div-btn-copy">
                    <button type="button">Copy</button>
                </div>

                <pre id="pre-sample5">60</pre>
            </section>
        </div>

    </div>
    <script src="./src/content.js"></script>
</body>

</html>
