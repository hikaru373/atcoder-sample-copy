name: バグ報告
description: バグを報告する
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます！

  - type: textarea
    id: bug
    attributes:
      label: バグの内容
      description: どのような問題が発生しましたか？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      description: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来どのように動作するべきですか？
    validations:
      required: true